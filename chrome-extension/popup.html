<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japan VPN</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Main View -->
    <div id="main-view" class="view">
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-logs" class="icon-btn" title="連線紀錄" aria-label="連線紀錄">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
          </button>
          <div>
            <div class="subtitle">日本專屬代理</div>
            <div class="title">Japan VPN</div>
          </div>
        </div>
        <div class="topbar-right">
          <button id="btn-refresh-main" class="icon-btn" title="重新抓取日本節點" aria-label="重新抓取">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
          <button id="btn-theme" class="icon-btn" title="切換主題" aria-label="切換主題">
            <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <div id="timer" class="timer">00:00:00</div>

      <div class="power-wrap">
        <div id="power-halo" class="power-halo"></div>
        <button id="btn-power" class="power-btn" aria-label="連線 / 中斷">
          <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </button>
      </div>

      <div class="status-block">
        <div class="status-label">連線狀態：</div>
        <div id="status-title" class="status-title">未連線</div>
        <div id="status-detail" class="status-detail">點擊電源鍵自動連線最佳日本代理</div>
      </div>

      <button id="btn-open-servers" class="card server-picker">
        <div class="jp-flag">
          <span class="jp-sun"></span>
        </div>
        <div class="server-picker-info">
          <div class="server-picker-title">JAPAN</div>
          <div id="selected-server-meta" class="server-picker-sub">載入日本節點中...</div>
        </div>
        <div class="chevron-pill">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </button>

      <section class="card controls-card">
        <div class="shield-row">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#C62828">
            <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/>
          </svg>
          <span id="filter-summary">已自動排除 0 個 219 開頭 • 可用 0 個日本代理</span>
        </div>

        <label class="toggle-row">
          <div class="toggle-text">
            <div class="toggle-title">無法連線／錯誤時自動切換節點</div>
            <div class="toggle-sub">代理失敗或無回應時自動切至下一個日本 IP</div>
          </div>
          <input type="checkbox" id="chk-failover" class="switch-input" checked />
        </label>

        <label class="toggle-row">
          <div class="toggle-text">
            <div class="toggle-title">背景定時自動抓取新節點</div>
            <div id="refresh-sub" class="toggle-sub">每 5 分鐘自動更新（最後更新：尚未更新）</div>
          </div>
          <input type="checkbox" id="chk-autorefresh" class="switch-input" checked />
        </label>

        <label class="toggle-row">
          <div class="toggle-text">
            <div class="toggle-title">防斷流主動健康檢查</div>
            <div class="toggle-sub">每 30 秒偵測連通，連續 2 次無回應自動切換</div>
          </div>
          <input type="checkbox" id="chk-health" class="switch-input" checked />
        </label>

        <button id="btn-switch-next" class="switch-next-btn hidden">
          切換下一個日本節點
        </button>
      </section>

      <footer class="footer-note">
        Chrome 插件僅代理瀏覽器流量；玩電腦遊戲請使用 Windows 桌面版
      </footer>
    </div>

    <!-- Server List View -->
    <div id="servers-view" class="view hidden">
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-back" class="icon-btn" title="返回" aria-label="返回">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="title">選擇日本節點</div>
        </div>
        <div class="topbar-right">
          <button id="btn-refresh-list" class="icon-btn" title="重新抓取" aria-label="重新抓取">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>
      </header>

      <div class="search-wrap">
        <input id="search-input" type="text" class="search-input" placeholder="搜尋 IP、協定 (SOCKS5/HTTP) 或城市..." />
      </div>

      <div class="filter-pill">
        <div id="pill-avail" class="filter-pill-active">日本免費代理 (0)</div>
        <div id="pill-excluded" class="filter-pill-muted">已排除 219 開頭 (0)</div>
      </div>

      <div id="server-list" class="server-list"></div>
    </div>

    <!-- Log Modal -->
    <div id="log-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-header">
          <span class="modal-title">連線與自動切換紀錄</span>
          <div class="modal-actions">
            <button id="btn-clear-logs" class="text-btn">清除</button>
            <button id="btn-close-logs" class="text-btn primary">關閉</button>
          </div>
        </div>
        <div id="log-content" class="log-content"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
